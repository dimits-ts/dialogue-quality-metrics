name: CI

on:
  push:

jobs:
  format:
    name: Format code with black
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to push the formatting commit
    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@24.10.0
        with:
          options: "--verbose"
          src: "."
      - name: Commit formatting changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: format code with black"

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Check out the branch tip so the formatting commit (if any) is included.
      # Commits pushed with GITHUB_TOKEN don't trigger a new workflow run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          # Once real tests import discomet, install the package too:
          # python -m pip install -e . pytest
          # python -m spacy download en_core_web_sm
      - name: Run tests
        run: python -m pytest